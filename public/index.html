<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>NEON ARENA</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body {
    width:100%; height:100%; overflow:hidden;
    background:#f6f8fb;
    font-family:'Trebuchet MS', 'Segoe UI', sans-serif;
    color:#1c2333;
    touch-action:none;
    -webkit-user-select:none; user-select:none;
    -webkit-touch-callout:none;
    overscroll-behavior:none;
  }
  #gameCanvas { display:block; background:#f6f8fb; cursor:crosshair; touch-action:none; }
  #minimap { position:fixed; z-index:6; right:16px; bottom:16px; border-radius:8px;
    border:1px solid rgba(0,140,180,0.25); box-shadow:0 2px 14px rgba(20,40,80,0.15);
    background:rgba(255,255,255,0.85); }

  /* -------------------- ANA MENU -------------------- */
  #menuScreen {
    position:fixed; inset:0; z-index:50; display:flex; align-items:center; justify-content:center;
    background:radial-gradient(ellipse at center, #ffffff 0%, #eef2f9 75%);
    flex-direction:column; text-align:center; padding:20px;
  }
  #menuTitle {
    font-size:48px; font-weight:bold; letter-spacing:8px; color:#00a3c4;
    text-shadow:0 0 18px rgba(0,163,196,0.35);
    margin-bottom:6px;
  }
  #menuTitle span { color:#ff2079; text-shadow:0 0 18px rgba(255,32,121,0.35); }
  #menuSub { font-size:12px; letter-spacing:3px; color:#5a6b8c; opacity:0.85; margin-bottom:28px; text-transform:uppercase; }

  #menuPanel {
    background:rgba(255,255,255,0.9); border:1px solid rgba(0,163,196,0.3);
    border-radius:16px; padding:26px 30px; box-shadow:0 8px 30px rgba(20,40,80,0.12);
    backdrop-filter:blur(6px); width:min(360px, 88vw);
  }
  #nameInput {
    width:100%; padding:12px 14px; font-size:16px; border-radius:10px;
    border:1px solid rgba(0,163,196,0.35); background:#fff; color:#1c2333;
    outline:none; text-align:center; letter-spacing:1px;
  }
  #nameInput:focus { border-color:#00a3c4; box-shadow:0 0 0 3px rgba(0,163,196,0.15); }

  #colorLabel { font-size:11px; letter-spacing:2px; color:#5a6b8c; margin:18px 0 8px; text-transform:uppercase; }
  #colorGrid { display:flex; flex-wrap:wrap; gap:8px; justify-content:center; }
  .swatch {
    width:30px; height:30px; border-radius:50%; cursor:pointer;
    border:2px solid rgba(0,0,0,0.08); transition:transform 0.12s ease;
  }
  .swatch.selected { border-color:#1c2333; transform:scale(1.18); box-shadow:0 0 8px currentColor; }
  #customColorWrap { display:flex; align-items:center; justify-content:center; gap:8px; margin-top:10px; }
  #customColor { width:34px; height:30px; border:none; background:none; cursor:pointer; }
  #customColorLbl { font-size:11px; color:#5a6b8c; opacity:0.9; }

  #playBtn {
    margin-top:22px; width:100%; padding:14px; font-size:16px; font-weight:bold; letter-spacing:2px;
    border-radius:12px; border:none; cursor:pointer; color:#fff;
    background:linear-gradient(90deg,#00a3c4,#ff2079);
    box-shadow:0 6px 18px rgba(0,163,196,0.35);
    text-transform:uppercase;
  }
  #playBtn:active { transform:scale(0.97); }
  #menuHint { margin-top:14px; font-size:11px; color:#5a6b8c; opacity:0.75; }
  #menuError { margin-top:10px; font-size:12px; color:#e0304a; min-height:14px; }

  /* -------------------- OYUN ICI HUD -------------------- */
  .hud { position:fixed; z-index:5; pointer-events:none; display:none; }
  .hud.show { display:block; }

  #leaderboard {
    top:16px; right:16px; background:rgba(255,255,255,0.88);
    border:1px solid rgba(0,163,196,0.3); border-radius:10px; padding:12px 16px;
    min-width:200px; box-shadow:0 4px 18px rgba(20,40,80,0.12); backdrop-filter:blur(4px);
  }
  #leaderboard h3 { font-size:13px; letter-spacing:2px; color:#00a3c4; margin-bottom:8px; text-transform:uppercase; }
  #leaderboard ol { list-style:none; }
  #leaderboard li { display:flex; justify-content:space-between; gap:12px; font-size:13px; padding:2px 0; color:#1c2333; }
  #leaderboard li span.name { display:flex; align-items:center; gap:6px; }
  #leaderboard .dot { width:9px; height:9px; border-radius:50%; display:inline-block; box-shadow:0 0 6px currentColor; }

  #hudSelf {
    left:16px; bottom:16px; background:rgba(255,255,255,0.88);
    border:1px solid rgba(255,32,121,0.3); border-radius:10px; padding:10px 16px;
    box-shadow:0 4px 18px rgba(20,40,80,0.12); font-size:14px; min-width:170px; color:#1c2333;
  }
  #hudSelf .big { font-size:22px; font-weight:bold; color:#ff2079; }

  #hallOfFame {
    left:16px; top:16px; background:rgba(255,255,255,0.88);
    border:1px solid rgba(0,163,196,0.3); border-radius:10px; padding:10px 14px;
    box-shadow:0 4px 18px rgba(20,40,80,0.12); min-width:150px; font-size:11px;
  }
  #hallOfFame h3 { font-size:11px; letter-spacing:1.5px; color:#00a3c4; margin-bottom:6px; text-transform:uppercase; }
  #hallOfFame li { display:flex; justify-content:space-between; gap:10px; padding:1px 0; color:#3a4460; list-style:none; }

  #title { top:76px; left:16px; font-size:20px; font-weight:bold; letter-spacing:3px; color:#00a3c4; }
  #title span { color:#ff2079; }
  #status { top:112px; left:16px; font-size:12px; color:#5a6b8c; opacity:0.9; }

  #soundToggle {
    position:fixed; z-index:16; top:16px; right:16px; width:38px; height:38px; border-radius:50%;
    background:rgba(255,255,255,0.88); border:1px solid rgba(0,163,196,0.3); color:#00a3c4;
    display:none; align-items:center; justify-content:center; font-size:16px; cursor:pointer;
    box-shadow:0 4px 14px rgba(20,40,80,0.12);
  }
  #soundToggle.show { display:flex; }

  #deathOverlay {
    position:fixed; inset:0; z-index:20; display:none; align-items:center; justify-content:center;
    flex-direction:column; background:rgba(255,255,255,0.92); text-align:center;
  }
  #deathOverlay h1 { font-size:44px; color:#ff2079; text-shadow:0 0 16px rgba(255,32,121,0.35); letter-spacing:4px; }
  #deathOverlay p { margin-top:10px; font-size:15px; color:#3a4460; }
  #deathOverlay .killer { margin-top:4px; font-size:13px; color:#e0304a; }

  #killToast {
    position:fixed; z-index:10; top:90px; left:50%; transform:translateX(-50%);
    background:rgba(255,255,255,0.92); border:1px solid #35b23b; color:#238a28;
    padding:6px 18px; border-radius:20px; font-size:13px; box-shadow:0 4px 14px rgba(20,40,80,0.15);
    display:none;
  }

  #joystickBase {
    position:fixed; z-index:15; border-radius:50%;
    background:rgba(255,255,255,0.55); border:2px solid rgba(0,163,196,0.4);
    box-shadow:0 4px 18px rgba(20,40,80,0.15); display:none; pointer-events:none;
    transform:translate(-50%,-50%);
  }
  #joystickStick {
    position:absolute; top:50%; left:50%; border-radius:50%;
    background:rgba(255,32,121,0.5); border:2px solid rgba(255,32,121,0.85);
    box-shadow:0 0 10px rgba(255,32,121,0.4); transform:translate(-50%,-50%);
  }

  #spectatorTag {
    position:fixed; z-index:8; top:50%; left:50%; transform:translate(-50%, 60px);
    font-size:12px; color:#5a6b8c; background:rgba(255,255,255,0.8);
    padding:4px 12px; border-radius:14px; display:none;
  }

  @media (max-width:640px){
    #leaderboard { padding:8px 12px; min-width:150px; }
    #leaderboard h3 { font-size:11px; }
    #leaderboard li { font-size:11px; }
    #hudSelf { padding:8px 12px; font-size:12px; min-width:130px; }
    #hudSelf .big { font-size:18px; }
    #title { font-size:16px; top:64px; }
    #status { top:96px; font-size:10px; }
    #hallOfFame { display:none; } /* kucuk ekranda yer acmak icin gizle */
    #deathOverlay h1 { font-size:32px; }
    #menuTitle { font-size:32px; letter-spacing:5px; }
    #minimap { width:100px !important; height:70px !important; right:8px; bottom:8px; }
  }
</style>
</head>
<body>

<canvas id="gameCanvas"></canvas>
<canvas id="minimap" width="160" height="110"></canvas>

<!-- ==================== ANA MENU ==================== -->
<div id="menuScreen">
  <div id="menuTitle">NEON <span>ARENA</span></div>
  <div id="menuSub">alan kapla &middot; rakiplerini izle &middot; hayatta kal</div>
  <div id="menuPanel">
    <input id="nameInput" type="text" maxlength="14" placeholder="İsmini yaz..." autocomplete="off">
    <div id="colorLabel">Renk Seç</div>
    <div id="colorGrid"></div>
    <div id="customColorWrap">
      <input id="customColor" type="color" value="#00a3c4">
      <span id="customColorLbl">özel renk</span>
    </div>
    <button id="playBtn">Oyuna Başla</button>
    <div id="menuError"></div>
    <div id="menuHint">Fare / WASD ile yön ver &middot; mobilde parmağınla sürükle</div>
  </div>
</div>

<div id="hallOfFame" class="hud">
  <h3>En İyiler</h3>
  <ol id="hofList"></ol>
</div>
<div id="title" class="hud">NEON <span>ARENA</span></div>
<div id="status" class="hud">bağlanıyor...</div>
<button id="soundToggle">🔊</button>

<div id="leaderboard" class="hud">
  <h3>Liderlik Tablosu</h3>
  <ol id="lbList"></ol>
</div>

<div id="hudSelf" class="hud">
  <div>SKOR: <span id="myScore" class="big">0</span></div>
  <div>ALAN: <span id="myArea">0%</span></div>
</div>

<div id="killToast"></div>
<div id="joystickBase"><div id="joystickStick"></div></div>
<div id="spectatorTag">izliyorsun...</div>

<div id="deathOverlay">
  <h1>ELENDİN</h1>
  <p id="respawnText">Yeniden doğuyorsun...</p>
  <p id="killerText" class="killer"></p>
</div>

<script src="/socket.io/socket.io.js"></script>
<script>
(function(){
  const canvas = document.getElementById('gameCanvas');
  const ctx = canvas.getContext('2d');
  const mini = document.getElementById('minimap');
  const miniCtx = mini.getContext('2d');

  const joystickBase = document.getElementById('joystickBase');
  const joystickStick = document.getElementById('joystickStick');

  function resize(){
    canvas.width = window.innerWidth; canvas.height = window.innerHeight;
    const isSmall = window.innerWidth <= 640;
    mini.width = isSmall ? 100 : 160; mini.height = isSmall ? 70 : 110;
    // Joystick boyutu ekrana oransal (duyarli)
    const base = Math.min(window.innerWidth, window.innerHeight);
    JOY_RADIUS = Math.max(40, Math.min(70, base * 0.09));
    const baseSize = JOY_RADIUS * 2, stickSize = JOY_RADIUS * 0.82;
    joystickBase.style.width = baseSize + 'px';
    joystickBase.style.height = baseSize + 'px';
    joystickStick.style.width = stickSize + 'px';
    joystickStick.style.height = stickSize + 'px';
  }
  window.addEventListener('resize', resize);

  const socket = io();

  let myId = null;
  let GRID_W = 110, GRID_H = 74, CELL = 20;
  let latestState = null;
  let joined = false;
  let camX = 0, camY = 0; // yumusatilmis kamera
  const knownAlive = {};  // olum efektleri icin onceki alive durumu
  const particles = [];
  let shakeMag = 0;       // ekran sarsintisi buyuklugu (azalarak)
  let myWasTrailing = false; // kendi izim var miydi (capture SFX icin)
  let spectatorId = null; // olunce izlenen rastgele oyuncu

  // Client-taraf lokal territory - server'dan delta ile guncellenir
  let localTerritory = null;      // Int16Array(GRID_W*GRID_H), -1 = bos
  let localSlotColors = {};
  let offCanvas = null, offCtx = null; // territory'nin onceden cizildigi tampon

  const PALETTE = ['#00a3c4','#ff2079','#7cc900','#ff9500','#8a3ffc','#ff5c5c','#00b894','#c9a400','#0fb5d6','#ff6a00'];

  const statusEl = document.getElementById('status');
  const lbList = document.getElementById('lbList');
  const hofList = document.getElementById('hofList');
  const myScoreEl = document.getElementById('myScore');
  const myAreaEl = document.getElementById('myArea');
  const deathOverlay = document.getElementById('deathOverlay');
  const respawnText = document.getElementById('respawnText');
  const killerText = document.getElementById('killerText');
  const killToast = document.getElementById('killToast');
  const menuScreen = document.getElementById('menuScreen');
  const nameInput = document.getElementById('nameInput');
  const colorGrid = document.getElementById('colorGrid');
  const customColor = document.getElementById('customColor');
  const playBtn = document.getElementById('playBtn');
  const menuError = document.getElementById('menuError');
  const soundToggle = document.getElementById('soundToggle');
  const spectatorTag = document.getElementById('spectatorTag');

  // -------------------- RENK SECIMI --------------------
  let selectedColor = PALETTE[0];
  PALETTE.forEach((c, i) => {
    const sw = document.createElement('div');
    sw.className = 'swatch' + (i === 0 ? ' selected' : '');
    sw.style.background = c;
    sw.style.color = c;
    sw.addEventListener('click', () => {
      selectedColor = c;
      customColor.value = c;
      [...colorGrid.children].forEach(el => el.classList.remove('selected'));
      sw.classList.add('selected');
    });
    colorGrid.appendChild(sw);
  });
  customColor.addEventListener('input', () => {
    selectedColor = customColor.value;
    [...colorGrid.children].forEach(el => el.classList.remove('selected'));
  });

  // -------------------- PROSEDUREL SENTEZ MUZIK + SFX --------------------
  const Music = (() => {
    let actx = null, master = null, filter = null, sfxGain = null, playing = false, muted = false;
    let nextNoteTime = 0, timerId = null, step = 0;
    const BPM = 96;
    const beatSec = 60 / BPM;
    const bass = [55.00, 55.00, 49.00, 41.20, 41.20, 55.00, 49.00, 55.00];
    const lead = [220.00, 246.94, 261.63, 293.66, 329.63, 293.66, 261.63, 246.94];

    function ensure() {
      if (actx) return;
      actx = new (window.AudioContext || window.webkitAudioContext)();
      master = actx.createGain(); master.gain.value = 0.14;
      sfxGain = actx.createGain(); sfxGain.gain.value = 0.5;
      filter = actx.createBiquadFilter(); filter.type = 'lowpass'; filter.frequency.value = 1800;
      master.connect(filter); filter.connect(actx.destination);
      sfxGain.connect(actx.destination);
    }
    function note(freq, time, dur, type, gain){
      const osc = actx.createOscillator();
      const g = actx.createGain();
      osc.type = type; osc.frequency.value = freq;
      g.gain.setValueAtTime(0, time);
      g.gain.linearRampToValueAtTime(gain, time + 0.03);
      g.gain.exponentialRampToValueAtTime(0.0001, time + dur);
      osc.connect(g); g.connect(master);
      osc.start(time); osc.stop(time + dur + 0.05);
    }
    function scheduler(){
      while (nextNoteTime < actx.currentTime + 0.25) {
        note(bass[step % bass.length], nextNoteTime, beatSec * 0.95, 'sawtooth', 0.22);
        if (step % 2 === 0) note(lead[step % lead.length], nextNoteTime, beatSec * 0.85, 'triangle', 0.12);
        if (step % 8 === 4) note(lead[(step + 2) % lead.length] * 2, nextNoteTime, beatSec * 0.4, 'sine', 0.05);
        nextNoteTime += beatSec;
        step++;
      }
      timerId = setTimeout(scheduler, 100);
    }

    // ---- Kisa efekt sesleri ----
    function sfxNote(freq, dur, type, gainVal, glideTo){
      if (!actx || muted) return;
      const t0 = actx.currentTime;
      const osc = actx.createOscillator();
      const g = actx.createGain();
      osc.type = type; osc.frequency.setValueAtTime(freq, t0);
      if (glideTo) osc.frequency.exponentialRampToValueAtTime(glideTo, t0 + dur);
      g.gain.setValueAtTime(0, t0);
      g.gain.linearRampToValueAtTime(gainVal, t0 + 0.015);
      g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
      osc.connect(g); g.connect(sfxGain);
      osc.start(t0); osc.stop(t0 + dur + 0.03);
    }

    return {
      start(){
        ensure();
        if (actx.state === 'suspended') actx.resume();
        if (playing) return;
        playing = true; nextNoteTime = actx.currentTime + 0.1; step = 0;
        scheduler();
      },
      toggleMute(){
        muted = !muted;
        if (master) master.gain.value = muted ? 0 : 0.14;
        return muted;
      },
      isMuted(){ return muted; },
      playCapture(){ if (actx) sfxNote(520, 0.18, 'triangle', 0.22, 900); },
      playDeath(){ if (actx) sfxNote(300, 0.35, 'sawtooth', 0.28, 60); },
      playKill(){ if (actx) sfxNote(660, 0.22, 'sine', 0.25, 1100); }
    };
  })();

  playBtn.addEventListener('click', () => {
    const name = nameInput.value.trim();
    Music.start();
    socket.emit('join', { name: name || null, color: selectedColor });
  });
  nameInput.addEventListener('keydown', (e) => { if (e.key === 'Enter') playBtn.click(); });

  soundToggle.addEventListener('click', () => {
    const muted = Music.toggleMute();
    soundToggle.textContent = muted ? '🔇' : '🔊';
  });

  // -------------------- TERRITORY (offscreen buffer + delta) --------------------
  function setupTerritoryBuffers(){
    localTerritory = new Int16Array(GRID_W * GRID_H).fill(-1);
    offCanvas = document.createElement('canvas');
    offCanvas.width = GRID_W * CELL;
    offCanvas.height = GRID_H * CELL;
    offCtx = offCanvas.getContext('2d');
  }

  function hexToRgba(hex, alpha){
    const r = parseInt(hex.slice(1,3),16), g = parseInt(hex.slice(3,5),16), b = parseInt(hex.slice(5,7),16);
    return `rgba(${r},${g},${b},${alpha})`;
  }

  // Tek bir hucreyi (dolgu + kenar cizgileri) offscreen tampona ciz
  function redrawCell(gx, gy){
    if (gx < 0 || gy < 0 || gx >= GRID_W || gy >= GRID_H) return;
    const i = gy * GRID_W + gx;
    const px = gx * CELL, py = gy * CELL;
    offCtx.clearRect(px, py, CELL, CELL);
    const slot = localTerritory[i];
    if (slot === -1) return;
    const color = localSlotColors[slot] || '#999';
    offCtx.fillStyle = hexToRgba(color, 0.38);
    offCtx.fillRect(px, py, CELL, CELL);

    const right = gx + 1 < GRID_W ? localTerritory[i + 1] : -1;
    const down  = gy + 1 < GRID_H ? localTerritory[i + GRID_W] : -1;
    const left  = gx - 1 >= 0 ? localTerritory[i - 1] : -1;
    const up    = gy - 1 >= 0 ? localTerritory[i - GRID_W] : -1;

    offCtx.strokeStyle = hexToRgba(color, 0.85);
    offCtx.lineWidth = 2;
    offCtx.beginPath();
    if (right !== slot) { offCtx.moveTo(px+CELL, py); offCtx.lineTo(px+CELL, py+CELL); }
    if (down  !== slot) { offCtx.moveTo(px, py+CELL); offCtx.lineTo(px+CELL, py+CELL); }
    if (left  !== slot) { offCtx.moveTo(px, py); offCtx.lineTo(px, py+CELL); }
    if (up    !== slot) { offCtx.moveTo(px, py); offCtx.lineTo(px+CELL, py); }
    offCtx.stroke();
  }

  function applyFullTerritory(territory, slotColors){
    localSlotColors = slotColors || {};
    for (let i = 0; i < territory.length; i++) localTerritory[i] = territory[i];
    offCtx.clearRect(0, 0, offCanvas.width, offCanvas.height);
    for (let gy = 0; gy < GRID_H; gy++)
      for (let gx = 0; gx < GRID_W; gx++)
        redrawCell(gx, gy);
  }

  function applyTerritoryDelta(deltaFlat, slotColors){
    if (slotColors) localSlotColors = slotColors;
    if (!deltaFlat || deltaFlat.length === 0) return;
    const touched = new Set();
    for (let k = 0; k < deltaFlat.length; k += 2) {
      const i = deltaFlat[k], slot = deltaFlat[k+1];
      localTerritory[i] = slot;
      const gx = i % GRID_W, gy = Math.floor(i / GRID_W);
      touched.add(gx + ',' + gy);
      // komsu hucrelerin kenar cizgileri de etkilenebilir
      touched.add((gx+1) + ',' + gy); touched.add((gx-1) + ',' + gy);
      touched.add(gx + ',' + (gy+1)); touched.add(gx + ',' + (gy-1));
    }
    for (const key of touched) {
      const [gx, gy] = key.split(',').map(Number);
      redrawCell(gx, gy);
    }
  }

  // -------------------- SOCKET EVENTLERI --------------------
  socket.on('connect', () => { statusEl.textContent = 'bağlandı — hayatta kal ve toprak kapla!'; });
  socket.on('disconnect', () => { statusEl.textContent = 'bağlantı kesildi...'; });
  socket.on('serverFull', () => { menuError.textContent = 'sunucu dolu, biraz sonra tekrar dene.'; });

  socket.on('init', (data) => {
    myId = data.id;
    GRID_W = data.gridW; GRID_H = data.gridH; CELL = data.cell;
    statusEl.textContent = 'İsim: ' + data.you.name;
    joined = true;
    menuScreen.style.display = 'none';
    document.querySelectorAll('.hud').forEach(el => el.classList.add('show'));
    soundToggle.classList.add('show');

    setupTerritoryBuffers();
    applyFullTerritory(data.territory, data.slotColors);
    renderHallOfFame(data.hallOfFame || []);
    rebuildStars();
  });

  socket.on('state', (data) => {
    if (latestState) {
      for (const p of latestState.players) knownAlive[p.id] = p.alive;
    }
    latestState = data;
    for (const p of data.players) {
      if (knownAlive[p.id] === true && p.alive === false) spawnDeathParticles(p.x * CELL, p.y * CELL, p.color);
      knownAlive[p.id] = p.alive;
    }
    if (localTerritory) applyTerritoryDelta(data.territoryDelta, data.slotColors);

    // Kendi capture animi icin: iz uzunlugu >0 iken 0'a dustuyse alan kapatilmis demektir
    const me = findMe(data);
    if (me) {
      const trailing = me.trail && me.trail.length > 0;
      if (myWasTrailing && !trailing) Music.playCapture();
      myWasTrailing = trailing;
    }
  });

  socket.on('hallOfFame', (list) => renderHallOfFame(list));

  socket.on('playerDied', (data) => {
    spawnDeathParticles(data.x * CELL, data.y * CELL, data.color);
  });

  socket.on('youDied', (data) => {
    Music.playDeath();
    shakeMag = 14;
    deathOverlay.style.display = 'flex';
    killerText.textContent = data.killerName ? ('Seni eleyen: ' + data.killerName) : 'Sinirlara ya da kendi izine çarptın.';
    let secs = Math.ceil(data.respawnMs / 1000);
    respawnText.textContent = secs + ' saniye sonra yeniden doğuyorsun...';
    pickSpectator();
    const t = setInterval(() => {
      secs -= 1;
      if (secs <= 0) { clearInterval(t); deathOverlay.style.display = 'none'; spectatorTag.style.display = 'none'; spectatorId = null; }
      else respawnText.textContent = secs + ' saniye sonra yeniden doğuyorsun...';
    }, 1000);
  });

  socket.on('killConfirm', (data) => {
    Music.playKill();
    killToast.textContent = '⚡ ' + data.victim + ' izini kesildi!';
    killToast.style.display = 'block';
    clearTimeout(killToast._t);
    killToast._t = setTimeout(() => killToast.style.display = 'none', 1800);
  });

  function renderHallOfFame(list){
    hofList.innerHTML = list.map((e,i) => `<li><span>${i+1}. ${e.name}</span><span>${e.score}</span></li>`).join('') || '<li>henüz yok</li>';
  }

  function pickSpectator(){
    if (!latestState) return;
    const alivePlayers = latestState.players.filter(p => p.alive && p.id !== myId);
    if (alivePlayers.length === 0) { spectatorTag.style.display = 'none'; spectatorId = null; return; }
    const chosen = alivePlayers[Math.floor(Math.random()*alivePlayers.length)];
    spectatorId = chosen.id;
    spectatorTag.textContent = 'izliyorsun: ' + chosen.name;
    spectatorTag.style.display = 'block';
  }

  // -------------------- KONTROLLER --------------------
  let desiredAngle = 0;
  const keyAngles = { 'w':-Math.PI/2, 'arrowup':-Math.PI/2, 's':Math.PI/2, 'arrowdown':Math.PI/2,
                      'a':Math.PI, 'arrowleft':Math.PI, 'd':0, 'arrowright':0 };

  window.addEventListener('keydown', (e) => {
    const k = e.key.toLowerCase();
    if (k in keyAngles) {
      desiredAngle = keyAngles[k];
      if (joined) socket.emit('setAngle', desiredAngle);
    }
  });

  canvas.addEventListener('mousemove', (e) => {
    if (!joined) return;
    const dx = e.clientX - canvas.width/2;
    const dy = e.clientY - canvas.height/2;
    desiredAngle = Math.atan2(dy, dx);
    socket.emit('setAngle', desiredAngle);
  });

  // -------------------- MOBIL DOKUNMATIK JOYSTICK --------------------
  let JOY_RADIUS = 55;
  const JOY_DEADZONE = 8;
  let joyTouchId = null, joyOriginX = 0, joyOriginY = 0;

  function isGameTouch(target){ return target === canvas || target.id === 'joystickBase' || target.id === 'joystickStick'; }

  function startJoystick(touch){
    joyTouchId = touch.identifier;
    joyOriginX = touch.clientX; joyOriginY = touch.clientY;
    joystickBase.style.left = joyOriginX + 'px';
    joystickBase.style.top = joyOriginY + 'px';
    joystickStick.style.transform = 'translate(-50%,-50%)';
    joystickBase.style.display = 'block';
  }
  function updateJoystick(touch){
    const dx = touch.clientX - joyOriginX, dy = touch.clientY - joyOriginY;
    const dist = Math.hypot(dx, dy);
    const clamped = Math.min(dist, JOY_RADIUS);
    const angle = Math.atan2(dy, dx);
    const sx = Math.cos(angle) * clamped, sy = Math.sin(angle) * clamped;
    joystickStick.style.transform = `translate(${sx}px, ${sy}px) translate(-50%,-50%)`;
    if (dist > JOY_DEADZONE) { desiredAngle = angle; if (joined) socket.emit('setAngle', desiredAngle); }
  }
  function endJoystick(){ joyTouchId = null; joystickBase.style.display = 'none'; }

  document.addEventListener('touchstart', (e) => {
    if (!joined || joyTouchId !== null) return;
    const touch = e.changedTouches[0];
    if (!isGameTouch(e.target)) return;
    e.preventDefault();
    startJoystick(touch);
  }, { passive:false });
  document.addEventListener('touchmove', (e) => {
    if (joyTouchId === null) return;
    for (const touch of e.changedTouches) if (touch.identifier === joyTouchId) { e.preventDefault(); updateJoystick(touch); break; }
  }, { passive:false });
  function handleTouchEnd(e){
    if (joyTouchId === null) return;
    for (const touch of e.changedTouches) if (touch.identifier === joyTouchId) { endJoystick(); break; }
  }
  document.addEventListener('touchend', handleTouchEnd, { passive:true });
  document.addEventListener('touchcancel', handleTouchEnd, { passive:true });

  // -------------------- ARKA PLAN (yumusak pastel lekeler) --------------------
  let blobs = [];
  function rebuildStars(){
    blobs = [];
    for (let i = 0; i < 10; i++) {
      blobs.push({
        x: Math.random() * GRID_W * CELL,
        y: Math.random() * GRID_H * CELL,
        r: 120 + Math.random() * 220,
        color: Math.random() > 0.5 ? '0,163,196' : '255,32,121',
        phase: Math.random() * Math.PI * 2
      });
    }
  }
  rebuildStars();

  function spawnDeathParticles(x, y, color){
    for (let i = 0; i < 22; i++) {
      const a = Math.random() * Math.PI * 2;
      const speed = 1 + Math.random() * 3;
      particles.push({ x, y, vx: Math.cos(a)*speed, vy: Math.sin(a)*speed, life: 1, color });
    }
  }
  function updateParticles(dt){
    for (let i = particles.length - 1; i >= 0; i--) {
      const pt = particles[i];
      pt.x += pt.vx; pt.y += pt.vy; pt.vx *= 0.94; pt.vy *= 0.94; pt.life -= dt * 1.6;
      if (pt.life <= 0) particles.splice(i, 1);
    }
  }

  // -------------------- RENDER --------------------
  function findMe(state){
    if(!state) return null;
    for(const p of state.players) if(p.id === myId) return p;
    return null;
  }
  function findById(state, id){
    if(!state || !id) return null;
    for(const p of state.players) if(p.id === id) return p;
    return null;
  }

  function drawBackground(t, cx, cy){
    ctx.fillStyle = '#f6f8fb';
    ctx.fillRect(0,0,canvas.width, canvas.height);
    ctx.save();
    ctx.translate(-cx*0.3, -cy*0.3);
    for (const b of blobs) {
      const pulse = 0.5 + 0.5 * Math.sin(t*0.0006 + b.phase);
      const grad = ctx.createRadialGradient(b.x, b.y, 0, b.x, b.y, b.r);
      grad.addColorStop(0, `rgba(${b.color},${0.10 + pulse*0.05})`);
      grad.addColorStop(1, `rgba(${b.color},0)`);
      ctx.fillStyle = grad;
      ctx.beginPath(); ctx.arc(b.x, b.y, b.r, 0, Math.PI*2); ctx.fill();
    }
    ctx.restore();
  }

  function drawGrid(cx, cy){
    ctx.strokeStyle = 'rgba(20,40,80,0.05)';
    ctx.lineWidth = 1;
    const startX = Math.floor(cx / CELL) - 1, endX = Math.ceil((cx + canvas.width) / CELL) + 1;
    const startY = Math.floor(cy / CELL) - 1, endY = Math.ceil((cy + canvas.height) / CELL) + 1;
    ctx.beginPath();
    for (let gx = startX; gx <= endX; gx++){ const sx = gx*CELL - cx; ctx.moveTo(sx, 0); ctx.lineTo(sx, canvas.height); }
    for (let gy = startY; gy <= endY; gy++){ const sy = gy*CELL - cy; ctx.moveTo(0, sy); ctx.lineTo(canvas.width, sy); }
    ctx.stroke();
  }

  // Territory artik onceden cizilmis offscreen tampondan tek seferde basiliyor
  function drawTerritory(){
    if (!offCanvas) return;
    ctx.drawImage(offCanvas, 0, 0);
  }

  function drawTrails(t){
    for (const p of latestState.players){
      if (!p.trail || p.trail.length < 1) continue;
      ctx.strokeStyle = p.color;
      ctx.shadowColor = p.color; ctx.shadowBlur = 10;
      ctx.lineWidth = CELL*0.6; ctx.lineJoin = 'round'; ctx.lineCap = 'round';
      ctx.setLineDash([10, 6]); ctx.lineDashOffset = -(t*0.03) % 16;
      ctx.beginPath();
      ctx.moveTo(p.trail[0].x*CELL + CELL/2, p.trail[0].y*CELL + CELL/2);
      for (let i=1; i<p.trail.length; i++) ctx.lineTo(p.trail[i].x*CELL + CELL/2, p.trail[i].y*CELL + CELL/2);
      ctx.lineTo(p.x*CELL, p.y*CELL);
      ctx.stroke();
      ctx.setLineDash([]); ctx.shadowBlur = 0;
    }
  }

  function drawPlayers(t){
    for (const p of latestState.players){
      if (!p.alive) continue;
      const pulse = 1 + Math.sin(t*0.005 + p.slot) * 0.08;
      ctx.save();
      ctx.translate(p.x*CELL, p.y*CELL);
      ctx.shadowColor = p.color; ctx.shadowBlur = 16 * pulse;
      ctx.fillStyle = p.color;
      ctx.beginPath(); ctx.arc(0,0, CELL*0.55*pulse, 0, Math.PI*2); ctx.fill();
      ctx.shadowBlur = 0;

      ctx.rotate(p.angle);
      ctx.fillStyle = '#ffffff';
      ctx.beginPath();
      ctx.moveTo(CELL*0.35,0); ctx.lineTo(-CELL*0.15, -CELL*0.22); ctx.lineTo(-CELL*0.15, CELL*0.22);
      ctx.closePath(); ctx.fill();
      ctx.restore();

      ctx.font = 'bold 11px Trebuchet MS';
      ctx.textAlign = 'center';
      ctx.fillStyle = 'rgba(255,255,255,0.7)';
      ctx.fillText(p.name, p.x*CELL+1, p.y*CELL - CELL*0.9+1);
      ctx.fillStyle = p.id===myId ? '#1c2333' : 'rgba(30,40,60,0.85)';
      ctx.fillText(p.name, p.x*CELL, p.y*CELL - CELL*0.9);
    }
  }

  function drawParticles(){
    for (const pt of particles) {
      ctx.globalAlpha = Math.max(0, pt.life);
      ctx.fillStyle = pt.color;
      ctx.shadowColor = pt.color; ctx.shadowBlur = 8;
      ctx.beginPath(); ctx.arc(pt.x, pt.y, 3, 0, Math.PI*2); ctx.fill();
    }
    ctx.globalAlpha = 1; ctx.shadowBlur = 0;
  }

  function drawMinimap(){
    miniCtx.fillStyle = 'rgba(255,255,255,0.9)';
    miniCtx.fillRect(0,0,mini.width, mini.height);
    if (!latestState || !localTerritory) return;
    const sx = mini.width / (GRID_W*CELL), sy = mini.height / (GRID_H*CELL);
    const step = GRID_W > 90 ? 2 : 1;
    for (let gy = 0; gy < GRID_H; gy += step){
      for (let gx = 0; gx < GRID_W; gx += step){
        const slot = localTerritory[gy*GRID_W+gx];
        if (slot === -1) continue;
        miniCtx.fillStyle = localSlotColors[slot] || '#999';
        miniCtx.fillRect(gx*CELL*sx, gy*CELL*sy, CELL*sx*step+1, CELL*sy*step+1);
      }
    }
    for (const p of latestState.players){
      if (!p.alive) continue;
      miniCtx.fillStyle = p.color;
      miniCtx.beginPath();
      miniCtx.arc(p.x*CELL*sx, p.y*CELL*sy, p.id===myId ? 3 : 2, 0, Math.PI*2);
      miniCtx.fill();
    }
  }

  let lastT = performance.now();
  function draw(t){
    requestAnimationFrame(draw);
    const dt = Math.min(0.05, (t - lastT)/1000); lastT = t;
    updateParticles(dt);
    if (shakeMag > 0) shakeMag = Math.max(0, shakeMag - dt*40);

    if (!latestState) { ctx.fillStyle = '#f6f8fb'; ctx.fillRect(0,0,canvas.width,canvas.height); return; }

    const me = findMe(latestState);
    let focus = me;
    if (!me && spectatorId) focus = findById(latestState, spectatorId);

    const targetX = (focus ? focus.x*CELL : GRID_W*CELL/2) - canvas.width/2;
    const targetY = (focus ? focus.y*CELL : GRID_H*CELL/2) - canvas.height/2;
    camX += (targetX - camX) * 0.14;
    camY += (targetY - camY) * 0.14;

    const shakeX = shakeMag > 0 ? (Math.random()-0.5) * shakeMag : 0;
    const shakeY = shakeMag > 0 ? (Math.random()-0.5) * shakeMag : 0;

    drawBackground(t, camX, camY);

    ctx.save();
    ctx.translate(-camX + shakeX, -camY + shakeY);
    drawGrid(camX, camY);

    ctx.strokeStyle = 'rgba(255,32,121,0.5)';
    ctx.shadowColor = '#ff2079'; ctx.shadowBlur = 8;
    ctx.lineWidth = 3;
    ctx.strokeRect(0,0, GRID_W*CELL, GRID_H*CELL);
    ctx.shadowBlur = 0;

    drawTerritory();
    drawTrails(t);
    drawPlayers(t);
    drawParticles();
    ctx.restore();

    updateHud(latestState, me);
    drawMinimap();
  }

  function updateHud(state, me){
    const top = [...state.players].sort((a,b)=>b.score-a.score).slice(0,8);
    lbList.innerHTML = top.map(p => `
      <li>
        <span class="name"><span class="dot" style="color:${p.color}; background:${p.color};"></span>${p.name}${p.id===myId ? ' (Sen)' : ''}</span>
        <span>${p.score}</span>
      </li>
    `).join('');

    if (me){
      myScoreEl.textContent = me.score;
      const pct = (me.areaCells / state.totalCells * 100);
      myAreaEl.textContent = (pct < 0 ? 0 : pct).toFixed(1) + '%';
    }
  }

  resize();
  requestAnimationFrame(draw);
})();
</script>
</body>
</html>
